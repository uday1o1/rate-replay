name: rate-replay
services:
  postgres:
    image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: ratereplay
      POSTGRES_USER: ratereplay
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratereplay -d ratereplay"]
      interval: 5s
      timeout: 3s
      retries: 12
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    secrets:
      - minio_user
      - minio_password
    volumes:
      - object-data:/data
secrets:
  postgres_password:
    file: ./.local-secrets/postgres_password
  minio_user:
    file: ./.local-secrets/minio_user
  minio_password:
    file: ./.local-secrets/minio_password
volumes:
  postgres-data:
  object-data:
