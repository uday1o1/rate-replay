[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rate-replay"
version = "0.0.0"
description = "Auditable electricity bill replay and flexible-load scheduling"
readme = "README.md"
requires-python = "==3.12.*"
license = { file = "LICENSE" }
dependencies = [
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "defusedxml==0.7.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "lxml==6.1.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "ortools==9.15.6755",
  "prometheus-client==0.26.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.52",
  "typer==0.27.1",
  "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "hypothesis==6.165.5",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
  "types-lxml==2026.2.16",
]

[project.scripts]
ratereplay-foundation = "ratereplay_domain.cli:app"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/ratereplay_api",
  "apps/worker/ratereplay_worker",
  "packages/domain/ratereplay_domain",
  "packages/ingestion/ratereplay_ingestion",
  "packages/tariffs/ratereplay_tariffs",
  "packages/optimizer/ratereplay_optimizer",
  "packages/reports/ratereplay_reports",
]

[tool.uv]
required-version = ">=0.11.23,<0.12"
package = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov --cov-report=term-missing --cov-fail-under=85"
testpaths = ["apps", "packages", "tests"]
pythonpath = [
  ".",
  "apps/api",
  "apps/worker",
  "packages/domain",
  "packages/ingestion",
  "packages/tariffs",
  "packages/optimizer",
  "packages/reports",
]

[tool.coverage.run]
branch = true
source = [
  "ratereplay_api",
  "ratereplay_worker",
  "ratereplay_domain",
  "ratereplay_ingestion",
  "ratereplay_tariffs",
  "ratereplay_optimizer",
  "ratereplay_reports",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["third_party"]

[tool.bandit]
exclude_dirs = ["third_party", "tests"]
